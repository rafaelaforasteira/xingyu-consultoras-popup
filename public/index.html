<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Xingyu — Fale com uma consultora</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="demo-shell">
    <div class="brand">XINGYU</div>
    <h1>Atendimento Xingyu</h1>
    <p>Demo inicial do seletor de consultoras.</p>
    <button id="open-consultants" class="primary-button">Falar com uma consultora</button>
  </main>

  <div id="consultant-overlay" class="popup-overlay" hidden>
    <section class="popup-dialog" role="dialog" aria-modal="true" aria-labelledby="popup-title" aria-describedby="popup-description">
      <button id="close-popup" class="popup-close" aria-label="Fechar">×</button>
      <div class="popup-eyebrow">XINGYU</div>
      <h2 id="popup-title">Fale com uma consultora</h2>
      <p id="popup-description">Escolha uma de nossas consultoras e continue seu atendimento pelo WhatsApp.</p>
      <div id="consultants-list" class="consultants-list" aria-live="polite"></div>
    </section>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
